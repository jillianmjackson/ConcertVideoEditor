<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>concert video editor</title>
  <meta name="description" content="turn a folder of concert photos and videos into a 9:16 video, right in your browser.">
  <meta name="theme-color" content="#FF06C1">
  <link rel="preload" href="fonts/CossetteTexte-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/CossetteTexte-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FF06C1'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-bar">
        <button class="icon-btn" id="back" type="button" aria-label="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <p class="hero-title">concert video editor</p>
        <p class="hero-count" id="count">1 / 4</p>
      </div>
      <h1 class="hero-name" id="title">add your media</h1>
      <p class="hero-sub" id="sub">a folder from the show, or just the photos and videos you want.</p>
      <div class="hero-actions" id="hero-actions"></div>
    </header>

    <nav class="pills" aria-label="steps">
      <button class="pill" type="button" data-step="0">upload</button>
      <button class="pill" type="button" data-step="1">template</button>
      <button class="pill" type="button" data-step="2">render</button>
      <button class="pill" type="button" data-step="3">export</button>
    </nav>

    <main>
      <!-- 1 · upload -->
      <section class="screen" data-screen="0">
        <div class="drop" id="drop">
          <p>or drop a folder here</p>
        </div>
        <p class="note" id="upload-status" aria-live="polite">photos and videos stay on your device.</p>
        <div class="tiles" id="tiles"></div>
      </section>

      <!-- 2 · template -->
      <section class="screen" data-screen="1" hidden>
        <div class="cards" id="cards" role="radiogroup" aria-label="templates"></div>
        <div class="words" id="words"></div>
      </section>

      <!-- 3 · render -->
      <section class="screen" data-screen="2" hidden>
        <div class="status" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="render-status">
          <div class="status-row">
            <p id="render-status" aria-live="polite">ready</p>
            <p class="status-pct" id="pct"></p>
          </div>
          <div class="track"><div class="bar" id="bar"></div></div>
          <p class="status-sub" id="render-sub"></p>
        </div>
        <div class="stage"><canvas id="preview" width="360" height="640" aria-label="preview"></canvas></div>
      </section>

      <!-- 4 · export -->
      <section class="screen" data-screen="3" hidden>
        <video id="result" controls playsinline muted loop></video>
        <p class="note" id="export-note"></p>
      </section>
    </main>

    <footer class="dock">
      <button class="dock-side dashed" id="dock-left" type="button">back</button>
      <span class="dock-dot" id="dock-dot" aria-hidden="true">1</span>
      <button class="dock-side solid" id="dock-right" type="button">next</button>
    </footer>
  </div>

  <input type="file" id="pick-folder" webkitdirectory directory multiple hidden>
  <input type="file" id="pick-files" accept="image/*,video/*,.heic,.heif,.mov" multiple hidden>
  <a id="download" download hidden></a>
</body>
</html>
